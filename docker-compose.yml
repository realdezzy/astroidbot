services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astroidbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting compose}
      POSTGRES_DB: ${POSTGRES_DB:-astroidbot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astroidbot"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  bot:
    build: .
    container_name: astroidbot
    restart: unless-stopped
    ports:
      - "8006:8006"
    env_file:
      - .env.docker
    volumes:
      - ./docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - ./Docs:/app/Docs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2.0"

  # Market-data ingestion. Same image, different entrypoint — see
  # src/indexer.ts for why this is a separate process at all.
  indexer:
    build: .
    container_name: astroidbot-indexer
    restart: unless-stopped
    entrypoint: ["/docker-entrypoint-indexer.sh"]
    env_file:
      - .env.docker
    volumes:
      - ./docker-entrypoint-indexer.sh:/docker-entrypoint-indexer.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Not just ordering: the bot owns `prisma migrate deploy`, so waiting for
      # it to be healthy is what guarantees this process starts against a
      # current schema.
      bot:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 5s
      # Generous: a cold chain's first pass walks INDEXER_INITIAL_LOOKBACK_BLOCKS
      # before it reports anything, and killing it mid-catch-up would restart
      # that walk from the same place forever.
      start_period: 120s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhousedata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spy", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

volumes:
  pgdata:
  redisdata:
  clickhousedata:
